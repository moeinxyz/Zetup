# Zetup - Tmux Configuration (Fixed for Dracula)
# ==========================

# Set true color support
set-option -sa terminal-overrides ",xterm*:Tc"

# Disable mouse support to let iTerm handle text selection naturally
set -g mouse off

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable vi mode
set-window-option -g mode-keys vi

# Copy mode for keyboard-based selection only
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# History limit
set -g history-limit 50000

# Escape time
set -sg escape-time 0

# Display time for pane indicators
set -g display-panes-time 800

# Display time for status messages
set -g display-time 1000

# Status update interval
set -g status-interval 10

# Window activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Window title
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'

# Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

# Dracula theme configuration
set -g @dracula-show-battery false
set -g @dracula-show-network false
set -g @dracula-show-weather false
set -g @dracula-show-time true
set -g @dracula-show-location false
set -g @dracula-show-fahrenheit false
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-left-icon-padding 0
set -g @dracula-right-icon-padding 0
set -g @dracula-show-cpu-usage true
set -g @dracula-show-ram-usage true
set -g @dracula-show-gpu-usage false

# Time format configuration (24-hour format, time only)
set -g @dracula-time-format "%H:%M"

# CPU and RAM usage labels (remove text labels)
set -g @dracula-cpu-usage-label "⚡"
set -g @dracula-ram-usage-label "💾"

# Additional CPU and RAM configuration
# set -g @dracula-cpu-display-load false

# Explicitly define which plugins to show (excludes weather)
set -g @dracula-plugins "battery cpu-usage ram-usage time"

# Additional Dracula options
set -g @dracula-refresh-rate 5
set -g @dracula-show-empty-plugins false
set -g @dracula-show-edge-icons false

# REMOVED: Custom status bar styling that conflicts with Dracula
# These lines were overriding the Dracula theme:
# set -g status-style 'bg=colour234 fg=colour137 dim'
# set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
# setw -g window-status-current-style 'fg=colour1 bg=colour19 bold'
# etc.

# Keep only pane borders if you want custom colors
set -g pane-border-style 'fg=colour238 bg=colour235'
set -g pane-active-border-style 'bg=colour236 fg=colour51'

# Load machine-specific tmux configuration
if-shell "test -f ~/.config/zetup/tmux.local.conf" "source ~/.config/zetup/tmux.local.conf"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'